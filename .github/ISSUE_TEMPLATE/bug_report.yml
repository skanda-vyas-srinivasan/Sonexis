name: Bug report
description: Report a reproducible Sonexis defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Sonexis. Please avoid attaching private recordings or preset data unless you have reviewed them.
  - type: input
    id: version
    attributes:
      label: Sonexis version
      placeholder: "2.1.0 (5) or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac model/architecture, and relevant audio device
      placeholder: "macOS 15.x, Apple Silicon, built-in output"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence.
      placeholder: |
        1. Start Sonexis...
        2. Add...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or additional context
      description: Remove personal data and secrets before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I can reproduce this on the version listed above.
          required: true
